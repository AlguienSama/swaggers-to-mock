openapi: 3.0.0
info:
  title: E2E fixture
  version: 1.0.0
servers:
  - url: https://example.test/api
paths:
  /health:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                status: ok
  /broken:
    get:
      responses:
        '200':
          description: Broken schema reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Missing'
  /external:
    get:
      responses:
        '200':
          description: External schema
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Health'
  /required/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: q
          in: query
          required: true
          type: string
      responses:
        '200':
          description: Required parameters accepted
          content:
            application/json:
              example:
                ok: true
        '400':
          description: Required parameter missing
          content:
            application/json:
              example:
                ok: false
